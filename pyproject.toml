[project]
name = "roofwatch"
version = "0.1.0"
description = "Finds and monitors suspected asbestos-cement roofs in Italy from free Sentinel-2 and aerial imagery (prototype)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pystac-client",
    "rasterio",
    "geopandas",
    "pyogrio",
    "shapely",
    "pyproj",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "folium",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel"]
aerial = ["torch", "torchvision", "timm", "pillow", "duckdb"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
